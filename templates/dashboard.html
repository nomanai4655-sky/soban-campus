{% extends "base.html" %}

{% block content %}
<div class="container">
  <h1 class="section-title">User Dashboard</h1>

  <div class="card animate-scroll" style="margin-bottom: 30px;">
    <h2>Welcome, {{ user_name }}!</h2>
    <p style="margin-top: 5px;">Registered Phone: {{ user_phone }}</p>
  </div>

  <div class="card animate-scroll">
    <h3>Personal To-Do List</h3>
    <div style="display: flex; gap: 10px; margin: 15px 0;">
      <input type="text" id="todoInput" class="form-control" placeholder="Add homework or reminder...">
      <button class="btn btn-primary" onclick="addTodo()">Add</button>
    </div>
    <ul id="todoList" style="list-style: none; padding: 0;"></ul>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", loadTodos);

function getTodos() {
  return JSON.parse(localStorage.getItem("soban_todos") || "[]");
}

function saveTodos(todos) {
  localStorage.setItem("soban_todos", JSON.stringify(todos));
}

function loadTodos() {
  const list = document.getElementById("todoList");
  list.innerHTML = "";
  const todos = getTodos();
  todos.forEach((item, index) => {
    const li = document.createElement("li");
    li.style.cssText = "padding: 10px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;";
    li.innerHTML = `<span>${item}</span> <button onclick="deleteTodo(${index})" class="btn" style="background:#dc2626; color:white; padding: 2px 8px; font-size: 0.8rem;">Delete</button>`;
    list.appendChild(li);
  });
}

function addTodo() {
  const input = document.getElementById("todoInput");
  if (!input.value.trim()) return;
  const todos = getTodos();
  todos.push(input.value.trim());
  saveTodos(todos);
  input.value = "";
  loadTodos();
}

function deleteTodo(index) {
  const todos = getTodos();
  todos.splice(index, 1);
  saveTodos(todos);
  loadTodos();
}
</script>
{% endblock %}
